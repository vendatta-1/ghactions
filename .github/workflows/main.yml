on:
 push:
    branches:
      - main
    paths:
      - "src/**"
       
 pull_request:
    branches:
      - main
    paths:
      - "src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps: 
      - name: Setup dotnet
        uses: actions/setup-dotnet@v3.4.2
        with: 
          dotnet-version: '10.0.x'

      - name: Grant Perm
        run: chmod +x test.sh

      - name:  Run Test
        run: ./test.sh

      
